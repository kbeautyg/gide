# Nixpacks конфигурация для Railway
# ВАЖНО: Установите Root Directory = backend в Railway Settings!

[phases.setup]
nixPkgs = ["python311", "python311Packages.pip"]

[phases.install]
cmds = ["python3.11 -m pip install -r backend/requirements.txt"]

[start]
cmd = "cd backend && python3.11 -m uvicorn app.main:app --host 0.0.0.0 --port $PORT"
