# Nixpacks для деплоя backend отдельно
[phases.setup]
nixPkgs = ["python311", "python311Packages.pip", "python311Packages.setuptools"]

[phases.install]
cmds = ["pip3 install --break-system-packages -r requirements.txt"]

# Убрана release фаза - туры уже созданы, не нужно запускать при каждом деплое
# [phases.release]
# cmds = ["python init_production_data.py"]

[start]
cmd = "bash start.sh"
