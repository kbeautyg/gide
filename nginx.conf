server {
    listen 80;
    server_name localhost;

    # Resolver for Docker DNS to handle container IP changes
    resolver 127.0.0.11 valid=30s;

    # Frontend
    location / {
        set $upstream_frontend http://frontend:80;
        proxy_pass $upstream_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Backend API
    location /api {
        set $upstream_backend http://backend:8000;
        proxy_pass $upstream_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend Docs (Swagger)
    location /docs {
        set $upstream_backend http://backend:8000;
        proxy_pass $upstream_backend/docs;
    }
    
    location /openapi.json {
        set $upstream_backend http://backend:8000;
        proxy_pass $upstream_backend/openapi.json;
    }
}


